name: Android

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest images no longer ship a usable Android SDK, and
      # android-actions/setup-android has been unreliable, so provision the
      # command line tools directly.
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only affects later steps, so call sdkmanager by full path here.
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only affects later steps, so call sdkmanager by full path here.
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Fall back to the shared debug keystore when no release key is configured,
      # so a tag never produces an unsignable build.
      - name: Resolve signing key
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "signing=true"
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$RELEASE_KEY_PASSWORD"
              echo "keyAlias=${RELEASE_KEY_ALIAS:-pox}"
              echo "keyPassword=${RELEASE_KEY_PASSWORD}"
            } >> "$GITHUB_OUTPUT"
          else
            debug_ks="$HOME/.android/debug.keystore"
            mkdir -p "$(dirname "$debug_ks")"
            keytool -genkeypair -keystore "$debug_ks" -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            {
              echo "signing=true"
              echo "storeFile=$debug_ks"
              echo "storePassword=android"
              echo "keyAlias=androiddebugkey"
              echo "keyPassword=android"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble release
        run: |
          ./gradlew --no-daemon :app:assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="${{ steps.signing.outputs.storeFile }}" \
            -Pandroid.injected.signing.store.password="${{ steps.signing.outputs.storePassword }}" \
            -Pandroid.injected.signing.key.alias="${{ steps.signing.outputs.keyAlias }}" \
            -Pandroid.injected.signing.key.password="${{ steps.signing.outputs.keyPassword }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" \
              --title "$TAG" \
              --generate-notes
          fi